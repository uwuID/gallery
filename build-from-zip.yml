name: Unzip and Build Lumina

# Put this file in your repo at:  .github/workflows/build-from-zip.yml
# and upload Lumina.zip to the root of the same repo.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q Lumina.zip
          ls Lumina

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: Lumina
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp Lumina/app/build/outputs/apk/release/*.apk Lumina.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-APK
          path: Lumina.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumina build ${{ github.run_number }}
          files: Lumina.apk
