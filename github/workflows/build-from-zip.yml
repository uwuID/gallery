name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ./*.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: glassnote
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: glassnote
        run: npx cap add android

      - name: Patch Android project
        working-directory: glassnote
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        working-directory: glassnote
        run: npx cap sync android

      - name: Build APK
        working-directory: glassnote/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          f=$(find glassnote/android/app/build/outputs/apk -name "*.apk" | head -n1)
          cp "$f" "out/GlassNote-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GlassNote-APK
          path: out/*.apk
